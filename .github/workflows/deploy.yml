name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke checks
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/robots.txt
          test -f dist/client/pdfs/WebsiteResume.pdf
          if grep -R '/_image' dist/client --include='*.html' >/dev/null; then
            echo 'Found runtime /_image URLs in HTML; use imageService compile/passthrough' >&2
            exit 1
          fi
          if grep -E '/projects' dist/client/sitemap*.xml >/dev/null 2>&1; then
            echo 'Sitemap still includes /projects' >&2
            exit 1
          fi
          while IFS= read -r path; do
            if [ ! -f "dist/client${path}" ]; then
              echo "og:image target missing in dist: ${path}" >&2
              exit 1
            fi
          done < <(
            grep -rho 'property="og:image" content="https://chrislawson.dev[^"]*"' dist/client --include='*.html' \
              | sed 's/.*content="https:\/\/chrislawson.dev//; s/"$//'
          )

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
